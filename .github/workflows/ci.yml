name: CI

on:
  push:
    branches: [main]
  pull_request:

# Một push mới lên cùng nhánh thì huỷ lượt chạy cũ — không ai cần kết quả của
# commit đã bị thay thế.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Chạy gộp vì đây đúng là lệnh người đóng góp chạy trước khi mở PR — CI
      # và máy cá nhân phải kiểm cùng một thứ, nếu không thì CI xanh mà máy đỏ.
      - run: bun run check

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần đủ lịch sử để so với nhánh đích, không chỉ commit cuối.
          fetch-depth: 0

      - name: Check commit messages
        run: |
          base="origin/${{ github.base_ref }}"
          failed=0
          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
              echo "::error::Not a Conventional Commit: $subject"
              failed=1
            elif [ ${#subject} -gt 72 ]; then
              echo "::error::Subject longer than 72 characters: $subject"
              failed=1
            fi
          done < <(git log --format=%s "$base..HEAD")
          exit $failed
